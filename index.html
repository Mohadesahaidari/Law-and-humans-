{title:'اهمیت موضوع برای افغانستان',kicker:'۲۰ · زمینه افغانستان',lead:'عدالت در شرایط بحران و ضعف',desc:'افغانستان با پیامدهای جنگ‌های طولانی، ناامنی، فقر، جابه‌جایی جمعیت و تغییرات سیاسی و حقوقی بنیادین روبه‌رو بوده است. در چنین شرایطی، افراد آسیب‌پذیر ممکن است به حمایت حقوقی بیشتری نیاز داشته باشند.',points:[['اصل راهنما','عدالت باید مستقل از قدرت سیاسی، ثروت اقتصادی، جنسیت یا موقعیت اجتماعی باشد.'],['اهمیت دسترسی به وکیل','دسترسی مؤثر به وکیل یکی از مهم‌ترین ابزارهای دفاع مؤثر و جلوگیری از نقض حقوق افراد است.']],img:img.mountain,quote:'حقوق بشر زمانی اهمیت واقعی خود را نشان می‌دهد که فرد در موقعیت ضعف قرار دارد.'},

];
const digits=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);let cur=0;const stage=document.getElementById('stage'),list=document.getElementById('list'),dots=document.getElementById('dots'),modal=document.getElementById('modal');
document.getElementById('total').textContent=digits(slides.length);
function imageUrl(key){return key?`https://images.unsplash.com/${key}?auto=format&fit=crop&w=1200&q=85`:''}
function renderSlide(s,i){if(s.cover){return `<section class="slide active flex-col justify-center"><div class="grid lg:grid-cols-[1.05fr_.95fr] gap-7 items-center"><div class="order-2 lg:order-1 py-2"><span class="pill inline-flex rounded-full px-4 py-2 text-xs sm:text-sm mb-6">${s.kicker}</span><h1 class="text-3xl sm:text-5xl xl:text-6xl font-black leading-[1.6]">${s.lead}<span class="block text-transparent bg-clip-text bg-gradient-to-l from-amber-100 via-amber-300 to-yellow-600">${s.sub}</span></h1><div class="goldline w-40 my-6"></div><p class="text-slate-300 leading-8">${s.desc}</p><div class="flex gap-3 mt-7"><div class="glass rounded-2xl px-4 py-3"><p class="text-xs text-slate-400">ارائه‌کننده</p><b>محدثه حیدری</b></div><div class="glass rounded-2xl px-4 py-3"><p class="text-xs text-slate-400">درس</p><b>حقوق بشر</b></div></div><button onclick="go(1)" class="mt-7 rounded-2xl bg-amber-200 text-slate-950 px-6 py-3.5 font-bold">شروع ارائه ←</button><p class="text-xs text-slate-500 mt-4">برای حرکت از دکمه‌ها، کلیدهای جهت‌دار یا کشیدن انگشت استفاده کنید.</p></div><div class="order-1 lg:order-2 relative"><div class="absolute -inset-3 rounded-[2rem] border border-amber-200/20 rotate-2"></div><div class="photo relative rounded-[1.7rem] overflow-hidden min-h-[260px] sm:min-h-[410px] lg:min-h-[535px] border border-white/10" style="background-image:linear-gradient(0deg,#080e19dc,transparent),url('${imageUrl(s.img)}')"><div class="absolute bottom-6 right-6 left-6 sm:bottom-8 sm:right-8"><p class="text-amber-200 text-sm">اصل بنیادین عدالت</p><p class="text-2xl sm:text-3xl font-bold mt-2">${s.quote}</p></div></div></div></div></section>`}
let points=(s.points||[]).map((p,j)=>`<div class="card rounded-2xl p-4 sm:p-5"><div class="flex gap-3 items-start"><span class="shrink-0 w-8 h-8 rounded-xl border border-amber-200/30 bg-amber-200/10 text-amber-100 grid place-items-center text-xs">${digits(j+1)}</span><div><h3 class="font-bold text-base sm:text-lg leading-7">${p[0]}</h3>${p[1]?`<p class="text-slate-400 text-sm sm:text-base leading-7 mt-1">${p[1]}</p>`:''}</div></div></div>`).join('');
let content=`<section class="slide flex-col justify-center"><div class="${s.img?'grid lg:grid-cols-[1.1fr_.9fr] gap-6 lg:gap-8 items-center':''} w-full"><div><span class="pill inline-flex rounded-full px-3 py-1.5 text-xs mb-5">${s.kicker}</span><h2 class="text-2xl sm:text-4xl font-extrabold leading-[1.7] mb-4">${s.title}</h2>${s.lead!==s.title?`<p class="text-xl sm:text-2xl font-bold text-amber-100 leading-9 mb-4">${s.lead}</p>`:''}${s.desc?`<p class="text-slate-300 text-base sm:text-lg leading-9 mb-5">${s.desc}</p>`:''}${s.points?.length?`<div class="grid ${s.points.length>3?'sm:grid-cols-2':''} gap-3">${points}</div>`:''}${s.quote?`<div class="mt-5 rounded-2xl border border-amber-200/25 bg-amber-200/5 p-5"><p class="text-amber-100 font-bold leading-8">${s.quote}</p></div>`:''}${s.note?`<p class="text-xs text-slate-500 leading-7 mt-4">${s.note}</p>`:''}</div>${s.img?`<div class="photo relative min-h-[220px] sm:min-h-[340px] lg:min-h-[440px] rounded-3xl overflow-hidden border border-white/10 mt-5 lg:mt-0" style="background-image:linear-gradient(0deg,#080e19c9,transparent),url('${imageUrl(s.img)}')"><div class="absolute bottom-5 right-5 left-5"><span class="text-amber-200 text-sm">${s.kicker}</span><p class="font-bold text-xl mt-2">${s.quote||s.lead}</p></div></div>`:''}</div></section>`;return content}
function build(){stage.innerHTML=slides.map((s,i)=>renderSlide(s,i).replace('slide active','slide')).join('');stage.children[0].classList.add('active');slides.forEach((s,i)=>{let b=document.createElement('button');b.className=`h-2 rounded-full ${i===0?'w-7 bg-amber-200':'w-2 bg-white/20'}`;b.title=s.title;b.setAttribute('aria-label',`اسلاید ${i+1}: ${s.title}`);b.onclick=()=>go(i);dots.appendChild(b);let row=document.createElement('button');row.className='w-full flex items-center gap-3 text-right rounded-xl p-3 hover:bg-white/5';row.innerHTML=`<span class="w-9 h-9 rounded-xl border border-white/10 grid place-items-center text-amber-200 text-xs">${digits(String(i+1).padStart(2,'0'))}</span><span class="text-sm">${s.title}</span><span class="mr-auto text-slate-500">←</span>`;row.onclick=()=>{go(i);closeModal()};list.appendChild(row)})}
function go(i){cur=Math.max(0,Math.min(slides.length-1,i));[...stage.children].forEach((el,j)=>el.classList.toggle('active',j===cur));document.getElementById('num').textContent=digits(String(cur+1).padStart(2,'0'));document.getElementById('section').textContent=slides[cur].title;document.getElementById('progress').style.width=((cur+1)/slides.length*100)+'%';document.getElementById('prev').disabled=cur===0;document.getElementById('next').disabled=cur===slides.length-1;[...dots.children].forEach((d,j)=>d.className=`h-2 rounded-full transition-all ${j===cur?'w-7 bg-amber-200':'w-2 bg-white/20'}`);[...list.children].forEach((d,j)=>d.classList.toggle('bg-amber-200/10',j===cur));window.scrollTo({top:0,behavior:'smooth'})}window.go=go;
function openModal(){modal.classList.remove('hidden');modal.classList.add('flex');document.body.style.overflow='hidden'}function closeModal(){modal.classList.add('hidden');modal.classList.remove('flex');document.body.style.overflow=''}
build();go(0);document.getElementById('prev').onclick=()=>go(cur-1);document.getElementById('next').onclick=()=>go(cur+1);document.getElementById('indexBtn').onclick=openModal;document.getElementById('mobileIndex').onclick=openModal;document.getElementById('close').onclick=closeModal;modal.onclick=e=>{if(e.target===modal)closeModal()};document.getElementById('fullBtn').onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){alert('حالت تمام‌صفحه در این مرورگر در دسترس نیست.')}};document.addEventListener('keydown',e=>{if(!modal.classList.contains('hidden')){if(e.key==='Escape')closeModal();return}if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(cur+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}if(e.key==='Home')go(0);if(e.key==='End')go(slides.length-1)});let tx=0,ty=0;document.addEventListener('touchstart',e=>{tx=e.changedTouches[0].screenX;ty=e.changedTouches[0].screenY},{passive:true});document.addEventListener('touchend',e=>{let dx=e.changedTouches[0].screenX-tx,dy=e.changedTouches[0].screenY-ty;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.2){if(dx<0)go(cur+1);else go(cur-1)}},{passive:true});
</script></body></html>
